name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.pkg_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg_name: cli-linux-x64
            binary_src: dist/cli
            binary_dest: claude-code-fork
          - os: macos-latest
            pkg_name: cli-darwin-arm64
            binary_src: dist/cli
            binary_dest: claude-code-fork
          - os: windows-latest
            pkg_name: cli-win32-x64
            binary_src: dist/cli.exe
            binary_dest: claude-code-fork.exe

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build

      - name: Copy binary into platform package
        shell: bash
        run: cp ${{ matrix.binary_src }} npm/${{ matrix.pkg_name }}/${{ matrix.binary_dest }}

      - name: Upload platform package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.pkg_name }}
          path: npm/${{ matrix.pkg_name }}/
          if-no-files-found: error

  publish:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all platform package artifacts
        uses: actions/download-artifact@v4
        with:
          path: npm-artifacts

      - name: Publish platform packages
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for pkg in cli-linux-x64 cli-darwin-arm64 cli-win32-x64; do
            PKG_DIR="npm-artifacts/npm-${pkg}"
            # Sync version to match main package
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('${PKG_DIR}/package.json', 'utf8'));
              p.version = '${VERSION}';
              fs.writeFileSync('${PKG_DIR}/package.json', JSON.stringify(p, null, 2) + '\n');
            "
            # Ensure Unix binary is executable (Windows .exe does not need chmod)
            if [ "${pkg}" != "cli-win32-x64" ]; then
              chmod +x "${PKG_DIR}/claude-code-fork"
            fi
            # Publish
            cd "${PKG_DIR}"
            npm publish --access public
            cd -
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync optionalDependencies version in main package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.optionalDependencies = {
              '@claude-code-fork/cli-linux-x64': '${VERSION}',
              '@claude-code-fork/cli-darwin-arm64': '${VERSION}',
              '@claude-code-fork/cli-win32-x64': '${VERSION}'
            };
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Publish main package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

